# Grassmoth Pipeline Configuration

# --- LLM defaults ----------------------------------------------------------
# OpenRouter defaults; each agentic context below may override individual fields.
llm:
  embedded:
    max_tokens: 65536
    timeout: 900
    reasoning_effort: xhigh

# --- Agentic contexts ------------------------------------------------------

# extraction: Support-Window Extraction (Workers)
extraction_workers:
  max_concurrent_workers: 200
  max_events_per_window: 300
  max_rpm: 450               # OpenRouter sliding-window RPM
  worker_timeout: 120        # per-LLM-call timeout in seconds
  max_tool_turns: 40
  llm:
    model: openrouter/deepseek/deepseek-v4-flash

# validation: Validation — no LLM (rule-based)

# model-spec: Model Specification & Prior Elicitation
# Inference — no LLM (NumPyro SSM)

# --- Inference -------------------------------------------------------------
inference:
  # Local studies retain their store/history here; only numerical fitting runs on GPU.
  compute_loo_diagnostics: false
  sampler:
    # SamplerSpec in packages/grassmoth/src/grassmoth/artifacts/sampling.py owns each field's
    # meaning and the source of its default.
    hardware: L40S
    num_warmup: 4000
    num_samples_per_chain: 1000
    num_chains: 4
    seed: 0
    n_parameter_particles: 2
    # path_update.method: particle_mgrad, twisted_particle_agrad or auxiliary_kalman.
    path_update:
      num_particles: 64
      method: particle_mgrad
      latent_step:
        kind: adapted
        target: 0.5
    parameter_proposal: random_walk
    param_target_accept: 0.2
    adaptation_scheme: dual_averaging
