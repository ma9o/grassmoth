[project]
name = "grassmoth-server"
version = "0.1.0"
description = "Study service and orchestration for Grassmoth"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ma9o" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "grassmoth",
    "botocore>=1.43.75",
    "fastapi>=0.142.2",
    "fsspec>=2026.9.0",
    "jax>=0.12.0.1",
    "jaxlib>=0.12.0.1",
    "modal>=1.6.0",
    "msgpack>=1.2.3",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "openai>=3.22.1",
    "orjson>=3.13.0",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pygit2>=1.20.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "s3fs>=2026.9.0",
    "temporalio>=1.33.0",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
grassmoth-server = "grassmoth_server.compute.analysis:main"
grassmoth-sweep = "grassmoth_server.study.sweep:sweep_cli"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# Notebooks import their support code as `notebooks.support.*` from this app root.
[tool.marimo.runtime]
pythonpath = ["."]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "."]

[tool.ruff.lint.per-file-ignores]
# The documentation contract belongs to src; fixtures and analysis cells are callers.
"!**/src/**.py" = ["D"]
# Argument counts are a boundary rule: the library's actions and the server take owners,
# while numerical kernels pass the arrays a traced program needs.
"**/tests/*.py" = [
    "ARG001",  # unused function arguments (pytest fixtures)
    "ARG002",  # unused method arguments (pytest fixtures)
    "DTZ001",  # tests intentionally use naive datetimes as compact fixtures
]
"**/tests/**/*.py" = [
    "ARG001",  # unused function arguments (pytest fixtures)
    "ARG002",  # unused method arguments (pytest fixtures)
    "DTZ001",  # tests intentionally use naive datetimes as compact fixtures
]
"!src/**" = ["PLR0913"]
"notebooks/**/*.py" = ["C408", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["grassmoth", "grassmoth_server", "grassmoth_test_support", "grassmoth_server_test_support", "packages"]
[tool.pydoclint]
style = "google"
check-style-mismatch = true
# Annotations own types; docstrings describe semantics without duplicating them.
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-arg-order = true
# Google style permits a complete one-line description for simple operations.
# Structured docstrings still receive every contract check configured below.
skip-checking-short-docstrings = true
skip-checking-private-functions = false
skip-checking-raises = false
should-declare-assert-error-if-assert-statement-exists = true
should-document-star-arguments = true
allow-init-docstring = true
# The local runner counts Field descriptions without duplicating Attributes entries.
check-class-attributes = true
ignore-private-class-attributes = false
ignore-special-dunder-class-attributes = false
# Properties keep their own docstrings beside their implementations.
treat-property-methods-as-class-attributes = false

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["tests", ".", "../../packages/grassmoth/tests", "notebooks", "../.."]

[tool.ty.src]
include = ["src", "tests", "scripts", "notebooks"]
exclude = ["**/.venv/**", "**/node_modules/**"]

[tool.ty.rules]
redundant-condition = "error"
redundant-condition-strict = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-unresolved-reference = "error"
unused-type-ignore-comment = "error"

[[tool.ty.overrides]]
include = ["src/**"]

[tool.ty.overrides.rules]
unsound-return-statement = "error"

[tool.ty.analysis]
respect-type-ignore-comments = true
# These dependencies do not publish PEP 561 typing metadata, so ty treats their
# import boundary as `Any`. The ArviZ component packages, Equinox, diffrax,
# optimistix, and y0 publish typing metadata and remain checked.
replace-imports-with-any = [
    # Dual-averaging annotations declare scalars, but vmap carries array states.
    "blackjax.adaptation.step_size",
    "numpyro.**",
]

[tool.basedpyright]
extends = "../../pyproject.toml"
include = ["src"]
venvPath = "../.."
venv = ".venv"

[tool.vulture]
# grassmoth_checks.run_vulture checks source, scripts, notebooks, and tests as
# independent ownership seams. External callers cannot make source code live.
paths = ["src"]
min_confidence = 60
sort_by_size = true
ignore_decorators = [
    "@flow",
    "@pytest.fixture",
    "@app.*",
    "@router.*",
    "@*_router.*",
    "@register_*",
    "@field_validator",
    "@field_serializer",
    "@model_validator",
    "@validator",
    "@root_validator",
    "@computed_field",
    "@property",
    "@*.defjvp",
    "@*.defvjp",
    "@*.list_tools",
    "@*.call_tool",
    "@workflow.signal",
    "@workflow.update",
    "@workflow.query",
    # MCP gateway tools are invoked by the MCP runtime, never by our code
    "@mcp.tool",
]
ignore_names = [
    "test_*",
    "model",
    "model_config",
    "pytestmark",
    "should_exit",
    "exc_type",
    "exc_val",
    "exc_tb",
    # marimo notebooks emit this module-level provenance stamp (used by marimo, not us)
    "__generated_with",
    # jax.profiler.ProfileOptions attributes (consumed by JAX, invisible to vulture)
    "host_tracer_level",
    "python_tracer_level",
    "include_dataset_ops",
    "enable_hlo_proto",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["s3fs", "uvicorn"]

[tool.pytest.ini_options]
pythonpath = [".", "tests", "../../packages/grassmoth/tests", "../.."]
testpaths = ["tests"]
addopts = "-p grassmoth_test_support.pytest_policy --import-mode=importlib -n auto -m 'not (inference or workflow)' --strict-markers --tb=short -ra --instafail --timeout=300 --durations=10"
markers = [
    "contract: isolated routing, validation, schema, identity, and projection without scientific numerical execution",
    "inference(concern): scientific numerical execution; concern must be sampling, warmup, simulation, predictive, or recovery",
    "workflow: Temporal workflows and worker orchestration",
]
jaxtyping_config = "../../packages/grassmoth/pyproject.toml"

[tool.grassmoth-checks]
vulture-seams = ["scripts", "notebooks", "tests"]
public-api = []

[tool.grassmoth-checks.roles]
annotation-modules = []

[tool.grassmoth-checks.roles.directories]
actions = "shell"
"actions/contracts" = "domain"
api = "edge"
storage = "edge"
study = "edge"
compute = "edge"
llm = "edge"

[tool.grassmoth-checks.roles.modules]
"actions/errors" = "domain"
"actions/prepare_data/context" = "domain"
"actions/prepare_data/messages" = "domain"
"actions/prepare_data/prompts" = "projection"
"actions/prepare_data/tool_contracts" = "domain"
"actions/prepare_data/window_text" = "compiler"
"actions/prepare_data/worker_output" = "domain"
"compute/traced_memory" = "compiler"
"llm/specs" = "domain"
"llm/traces" = "domain"
__init__ = "edge"
bootstrap = "edge"
config = "edge"
"compute/__init__" = "domain"
"llm/__init__" = "domain"
"study/records" = "domain"
"study/persistence/codec" = "compiler"
"study/persistence/log_codec" = "projection"
"study/errors" = "domain"
"study/snapshot" = "domain"
"study/state" = "domain"
"storage/cache" = "shell"
"actions/call_logs" = "edge"
"actions/messages" = "projection"
"actions/progress" = "edge"
"actions/temporal/client" = "edge"
"actions/temporal/errors" = "edge"
"actions/fit/remote" = "edge"
"actions/prepare_data/planning" = "shell"
"actions/temporal/study/messages" = "edge"
"actions/temporal/llm/activities" = "edge"
"actions/temporal/llm/tools" = "edge"
"actions/temporal/llm/context" = "edge"
"actions/temporal/llm/storage" = "edge"
"actions/temporal/llm/messages" = "edge"
"actions/temporal/extraction/activities" = "edge"
"actions/temporal/extraction/cache" = "edge"
"actions/temporal/extraction/messages" = "edge"
"actions/temporal/extraction/settings" = "edge"
"actions/temporal/extraction/source_data" = "edge"
