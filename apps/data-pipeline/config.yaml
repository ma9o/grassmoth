# N-of-1 Causal Lab Pipeline Configuration

# --- LLM backend defaults --------------------------------------------------
# Each agentic context below picks a harness via `llm.harness`; these defaults
# apply when a context doesn't override individual fields.
llm:
  # harness: none  (OpenRouter direct)
  embedded:
    max_tokens: 65536
    timeout: 900
    reasoning_effort: xhigh

  # harness: claude-code  (spawns `claude -p`)
  claude_code:
    bin: claude
    effort: high          # low | medium | high | xhigh | max
    max_turns: 40
    max_budget_usd: null
    fallback_model: null

  # harness: codex  (spawns `codex exec`)
  codex:
    bin: codex
    reasoning_effort: xhigh  # low | medium | high | xhigh | max
    service_tier: fast

  # harness: pi  (spawns `pi --mode json`)
  pi:
    bin: pi
    provider: openai-codex
    thinking: high          # off | minimal | low | medium | high | xhigh

# --- Agentic contexts ------------------------------------------------------

# extraction: Support-Window Extraction (Workers)
# extraction fans out across thousands of workers; harness cold-start per worker
# is untenable, so `harness` is locked to `none` (enforced by config validator).
extraction_workers:
  max_concurrent_workers: 200
  max_events_per_window: 300
  max_rpm: 450               # OpenRouter sliding-window RPM (embedded-only)
  worker_timeout: 120        # per-LLM-call timeout in seconds
  max_tool_turns: 40
  llm:
    harness: none
    model: openrouter/deepseek/deepseek-v4-flash

# validation: Validation — no LLM (rule-based)

# model-spec: Model Specification & Prior Elicitation
# Inference — no LLM (NumPyro SSM)

# --- Inference -------------------------------------------------------------
inference:
  # Local studies retain their store/history here; only numerical fitting runs on GPU.
  hardware: L40S
  compute_loo_diagnostics: false
  sampler:
    num_warmup: 4000
    num_samples_per_chain: 1000
    num_chains: 4
    seed: 0
    num_particles: 64
    # Select {method: nuts_da} for joint state/parameter NUTS with dual averaging.
    algorithm:
      method: custom
      n_parameter_particles: 2
      # The indexed production method: parallel-in-time c-dSMC tree smoother with the
      # paid mixture leaf (amala_exact z-component + fixed LAPS-pilot component + wide
      # tail). Benchmarked in notebooks/sampler_audit.py §15-§16.
      dsmc_leaf_proposal: paid_mix
      latent_delta: 0.2
      parameter_proposal: pseudo_langevin
      param_step_size: 0.02
      param_target_accept: 0.35
      adaptation_rate: 0.05
