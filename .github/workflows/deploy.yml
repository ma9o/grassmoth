name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # let deploys finish

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/grassmoth-client/**'
              - 'packages/**'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
            python:
              - 'apps/grassmoth-server/**'
              - 'packages/grassmoth/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'conftest.py'
              - 'tests/**'
              - 'scripts/check_python.py'
              - 'packages/api-types/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  ci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: uv sync --frozen --all-packages --group dev
        working-directory: apps/grassmoth-server

      - run: bun install --frozen-lockfile

      - run: bun run lint

  ci-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/grassmoth-client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/grassmoth-client/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run --cwd apps/grassmoth-client --parallel --no-exit-on-error test build

  ci-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Cache JAX compilations
        uses: actions/cache@v4
        with:
          path: ~/.cache/grassmoth/jax
          key: jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('apps/grassmoth-server/src/**/*.py', 'packages/grassmoth/src/**/*.py') }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-${{ runner.os }}-

      - run: uv sync --frozen --all-packages --group dev
        working-directory: apps/grassmoth-server

      - run: bun run test:python

  # ---------------------------------------------------------------------------
  # Deploy Modal functions (stages 2, 4, 5b)
  # GitHub secrets → Modal secret block → env vars inside containers
  # ---------------------------------------------------------------------------
  deploy-modal:
    needs: [changes, ci-lint, ci-python]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/grassmoth-server
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages --group dev --group cloud
      - name: Sync runtime secrets to Modal
        run: |
          uv run modal secret create --force grassmoth-server-secrets \
            DEPLOYMENT_ENV=production \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            GOOGLE_CLOUD_PROJECT="${{ secrets.GOOGLE_CLOUD_PROJECT }}" \
            GOOGLE_CLOUD_LOCATION="${{ secrets.GOOGLE_CLOUD_LOCATION }}" \
            EXA_API_KEY="${{ secrets.EXA_API_KEY }}" \
            R2_ENDPOINT_URL="${{ secrets.R2_ENDPOINT_URL }}" \
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            R2_BUCKET="${{ secrets.R2_BUCKET }}" \
            R2_PREFIX=data
      - run: uv run modal deploy src/grassmoth_server/api/deployment.py

  # ---------------------------------------------------------------------------
  # Deploy web app to Vercel (production)
  # GitHub secrets → Vercel env vars → available at runtime
  # ---------------------------------------------------------------------------
  deploy-vercel:
    needs: [changes, ci-lint, ci-web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - name: Sync runtime secrets to Vercel
        run: |
          sync_required_env() {
            if [ -z "$2" ]; then
              echo "$1 is required for Vercel deployment" >&2
              exit 1
            fi
            printf '%s' "$2" | bunx vercel env add "$1" production --yes --force --token="$VERCEL_TOKEN"
          }
          sync_env() { printf '%s' "$2" | bunx vercel env add "$1" production --yes --force --token="$VERCEL_TOKEN"; }
          sync_env DEPLOYMENT_ENV           production
          sync_required_env TOOL_SERVER_URL      "${{ secrets.TOOL_SERVER_URL }}"
          sync_env R2_ENDPOINT_URL          "${{ secrets.R2_ENDPOINT_URL }}"
          sync_env R2_ACCESS_KEY_ID         "${{ secrets.R2_ACCESS_KEY_ID }}"
          sync_env R2_SECRET_ACCESS_KEY     "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          sync_env R2_BUCKET                "${{ secrets.R2_BUCKET }}"
          sync_env R2_PREFIX                data
      - run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: bunx vercel build --prod --token="$VERCEL_TOKEN"
      - run: bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

