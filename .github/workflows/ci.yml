name: CI

on:
  pull_request:
  workflow_call:
    outputs:
      web:
        value: ${{ jobs.changes.outputs.web }}
      python:
        value: ${{ jobs.changes.outputs.python }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/grassmoth-client/**'
              - 'packages/**'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            python:
              - 'apps/grassmoth-server/**'
              - 'packages/grassmoth/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'conftest.py'
              - 'scripts/check_python.py'
              - 'packages/api-types/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: uv sync --frozen --all-packages --group dev
        working-directory: apps/grassmoth-server

      - run: bun install --frozen-lockfile

      - run: bun run lint

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/grassmoth-client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/grassmoth-client/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run --cwd apps/grassmoth-client --parallel --no-exit-on-error test build

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Cache JAX compilations
        uses: actions/cache@v4
        with:
          path: ~/.cache/grassmoth/jax
          key: jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('apps/grassmoth-server/src/**/*.py', 'packages/grassmoth/src/**/*.py') }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-${{ runner.os }}-

      - run: uv sync --frozen --all-packages --group dev
        working-directory: apps/grassmoth-server

      - run: bun run test:python
