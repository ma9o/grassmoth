[project]
name = "grassmoth"
version = "0.1.0"
description = "Continuous-time nonlinear Bayesian causal inference"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ma9o" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "arviz-base>=1.3.1",
    "arviz-stats[xarray]>=1.3.3",
    "blackjax>=1.6.2",
    "diffrax>=0.7.2",
    "dynestyx>=0.6.0",
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "pytimeparse2>=1.7.1",
    "python-dateutil>=2.9.0.post0",
    "y0 @ git+https://github.com/y0-causal-inference/y0.git",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
